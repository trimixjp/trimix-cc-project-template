# {{team_name}} レビュー設定

review:
  mode: auto

  double_review_criteria:
    file_count_threshold: 5
    sensitive_areas:
      - 認証・認可
      - 決済・課金
      - 個人情報・機密データ
      - セキュリティ設定
    cross_layer_changes: true
    labels:
      - "complexity:high"
      - "security-sensitive"
      - "breaking-change"

  single_review_criteria:
    - 単一ファイルの変更
    - ドキュメント・コメントのみの変更
    - 設定値・定数の変更

post_review:
  create_pr: true
  pr_agent: pr-creator
