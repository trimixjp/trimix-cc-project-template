# バックエンドチーム レビュー設定
# レビュー方式は Tech-Lead が実装内容の影響範囲を分析して自動判断します
# このファイルはその判断基準を定義します

review:
  mode: auto  # AIが以下の基準に従って自動判断します

  # ダブルレビュー（reviewer-a + reviewer-b + クロスレビュー）を選択する基準
  # 以下のいずれかに1つでも該当する場合はダブルレビュー
  double_review_criteria:
    file_count_threshold: 5          # 変更ファイル数がこれ以上
    sensitive_areas:                 # これらの領域を含む変更（pattern は拡張正規表現。全 pattern に単語境界 \b を付与。detection_procedure で機械照合する）
      - id: auth
        description: 認証・認可（auth / login / session / token / JWT）
        pattern: '\b(auth|login|session|token|jwt|oauth)\b'
      - id: payment
        description: 決済・課金（payment / billing / stripe / invoice）
        pattern: '\b(payment|billing|stripe|invoice|charge)\b'
      - id: personal-data
        description: 個人情報・機密データ（user / password / email / PII）
        pattern: '\b(user|password|email|pii|credential|secret)\b'
      - id: db-schema
        description: データベーススキーマ・マイグレーション（migration / schema）
        pattern: '\b(migration|schema|migrate)\b'
      - id: public-api
        description: 公開API（破壊的変更・エンドポイントの追加・削除）
        pattern: '\b(api|endpoint|route|openapi|swagger)\b'
      - id: security-config
        description: セキュリティ設定（cors / csrf / rate-limit / firewall）
        pattern: '\b(cors|csrf|rate[-_]?limit|firewall|csp)\b'
    cross_layer_changes: true        # 複数レイヤー（DB/API/Frontend）にまたがる変更
    labels:                          # これらのラベルが付与されている場合
      - "complexity:high"
      - "security-sensitive"
      - "breaking-change"

  # 機械判定手順
  # Tech-Lead はこの手順どおりにコマンドを実行し、計測値（ファイル数・ヒットした pattern と件数）を
  # レビュー方式判断コメントに必ず記載する。主観での判定は禁止
  # 注: grep -c の結果は「マッチ行数」。ヒット0件時は grep が終了コード1を返すため `|| true` を併記する
  detection_procedure:
    base_branch: main   # 計測の基準ブランチ。プロジェクトのデフォルトブランチに合わせて変更
    steps:
      # 0. 基準ブランチの存在確認
      - id: verify-base
        command: 'git rev-parse --verify <base_branch>'
        judge: "失敗した場合は計測不能。安全側に倒しダブルレビューとし、その旨をレビュー方式判断コメントに記録する"
      # 1. 変更ファイル数
      - id: file-count
        command: 'git diff --name-only <base_branch>...HEAD | wc -l'
        judge: "結果が file_count_threshold（5）以上ならダブルレビュー該当"
      # 2. パス照合（該当確定）
      - id: path-match
        command: 'git diff --name-only <base_branch>...HEAD | grep -ciE "<pattern>" || true'
        judge: "各 sensitive_areas の pattern についてマッチ行数が1以上なら該当確定（ヒットした id と件数をコメントに記録する）"
      # 3. 本文照合（参考値）
      - id: body-match
        command: 'git diff <base_branch>...HEAD --unified=0 | grep "^+" | grep -v "^+++" | grep -ciE "<pattern>" || true'
        judge: "マッチ行数をコメントに記録するのみ（参考値）。該当判定には使わない"

  # シングルレビュー（reviewer のみ）を選択する基準
  # ダブルレビュー基準に該当しない場合はシングルレビュー
  single_review_criteria:
    - 単一ファイルの変更
    - ドキュメント・コメントのみの変更
    - テストの追加（実装ロジックの変更なし）
    - 設定値・定数の変更（アルゴリズムの変更なし）
    - スタイル・フォーマットの修正

# 全レビュアー共通のレビュー基準（チェックリスト）
# reviewer / reviewer-a / reviewer-b はこのチェックリストを参照してレビューする
# （各エージェント定義に共通基準を重複記載しない。重点観点の差別化は各エージェント定義を参照）
review_criteria:
  - id: correctness
    item: 機能の正しさ
    check: 要件・設計方針どおりに動作し、エッジケースが考慮されている
  - id: test-coverage
    item: テスト網羅
    check: 新規実装箇所にテストが存在し、正常系・異常系をカバーしている
  - id: readability
    item: 可読性・保守性
    check: 命名が意図を表現し、1関数が単一の責務（50行以内目安）。重複ロジックがない
  - id: security
    item: セキュリティ
    check: ハードコードされたシークレットがない。外部入力が適切に検証されている
  - id: performance
    item: パフォーマンス
    check: N+1・不要なループ・オーバーフェッチ等の明らかな性能劣化がない
  - id: error-handling
    item: エラー処理
    check: 失敗しうる処理に適切なエラーハンドリングがあり、エラーを握りつぶしていない

# レビュー完了後のフロー
post_review:
  create_pr: true
  pr_agent: pr-creator
