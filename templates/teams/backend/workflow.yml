# バックエンドチーム ワークフロー定義
# 条件分岐付き。レビュー方式は Tech-Lead が実装内容の影響範囲から自動判断します

name: backend-workflow
description: コード実装・API・テスト等バックエンドリングタスクのワークフロー

# 同一Issueでの差し戻し上限。3回目の不合格（差し戻し）は escalated:human へ
# （カウント手順は各レビュー役エージェント定義の「差し戻しカウント手順」を参照）
rework_limit: 2

# ラベル命名規則
labels:
  prefix: "backend"
  examples:
    - "backend:tech-lead"
    - "backend:implementer"
    - "backend:reviewer"
    - "backend:reviewer-a"
    - "backend:reviewer-b"
    - "backend:cross-review"
    - "backend:version-bumper"
    - "backend:tech-writer"
    - "backend:pr-creator"
    - "contributor:ready"
    - "escalated:human"

steps:

  - id: tech-lead-analysis
    agent: tech-lead
    label: "backend:tech-lead"
    description: 要件分析・設計方針の決定・インシデント確認
    on_complete:
      next: implementer
    on_escalation:
      next: human-escalator

  - id: implementer
    agent: implementer
    label: "backend:implementer"
    description: Tech-Leadの設計方針に従い実装・テスト実施
    on_complete:
      next: tech-lead-review-decision
    on_escalation:
      next: human-escalator
    on_rework:
      # Reviewerからの差し戻し時
      condition: "差し戻し"
      next: implementer

  - id: tech-lead-review-decision
    agent: tech-lead
    label: "backend:tech-lead"
    description: |
      実装内容の影響範囲を分析してレビュー方式を自動判断する。
      review-config.yml の double_review_criteria を参照。
    on_complete:
      conditions:
        - id: single-review
          description: ダブルレビュー基準に非該当
          criteria:
            - 変更ファイル数が5未満
            - 認証・決済・個人情報・DBスキーマ・公開API・セキュリティ設定に非該当
            - 単一レイヤーの変更
            - 複雑度・セキュリティ関連ラベルなし
          next: reviewer

        - id: double-review
          description: 以下のいずれかに1つでも該当する場合
          criteria:
            - 変更ファイル数が5以上
            - 認証・認可・決済・個人情報・DBスキーマ・公開API・セキュリティ設定に関わる変更
            - 複数レイヤー（DB/API/Frontend）にまたがる変更
            - "complexity:high / security-sensitive / breaking-change ラベルあり"
          next: [reviewer-a, reviewer-b]  # 並列起動
    on_escalation:
      next: human-escalator

  - id: reviewer
    agent: reviewer
    label: "backend:reviewer"
    description: シングルレビュー。コード品質・設計整合・テストをレビューする
    on_complete:
      condition: 合格
      next: version-bumper
    on_rework:
      condition: 不合格
      next: implementer
      # rework_limit（2回）超過時 = 同一Issueで3回目の不合格は implementer へ差し戻さず human-escalator へ
      limit_exceeded_next: human-escalator
    on_escalation:
      next: human-escalator

  - id: reviewer-a
    agent: reviewer-a
    label: "backend:reviewer-a"
    description: ダブルレビューのA。Reviewer-Bと独立して並列レビューを実施する
    parallel_with: reviewer-b
    on_complete:
      condition: 独立レビュー完了
      next: cross-review  # 両者完了後にクロスレビューへ
    on_escalation:
      next: human-escalator

  - id: reviewer-b
    agent: reviewer-b
    label: "backend:reviewer-b"
    description: ダブルレビューのB。Reviewer-Aと独立して並列レビューを実施する
    parallel_with: reviewer-a
    on_complete:
      condition: 独立レビュー完了
      next: cross-review  # 両者完了後にクロスレビューへ
    on_escalation:
      next: human-escalator

  - id: cross-review
    agent: reviewer-a  # Reviewer-Aがクロスレビューをリード、Reviewer-Bが応答
    label: "backend:cross-review"
    description: Reviewer-AとBが互いのレビュー結果を比較・議論して最終判定を出す
    requires_all_of: [reviewer-a, reviewer-b]  # 両方の完了が必要
    on_complete:
      condition: 合格（両者合意）
      next: version-bumper
    on_rework:
      condition: 不合格
      next: implementer
      # rework_limit（2回）超過時 = 同一Issueで3回目の不合格は implementer へ差し戻さず human-escalator へ
      limit_exceeded_next: human-escalator
    on_escalation:
      condition: 意見が割れて判断できない
      next: human-escalator

  # version_management: auto の場合はpackage.jsonをインクリメントしてtech-writerへ
  # version_management: manual の場合はスキップしてtech-writerへ
  # このステップを削除するとバージョン管理がワークフロー外になります
  - id: version-bumper
    agent: version-bumper
    label: "backend:version-bumper"
    description: |
      ai-team-config.yml の version_management 設定に従いバージョンを管理する。
      auto: conventional commitに基づきpackage.jsonを自動インクリメント
      manual: スキップしてtech-writerへ引き継ぎ
    on_complete:
      next: tech-writer
    on_escalation:
      next: human-escalator

  - id: tech-writer
    agent: tech-writer
    label: "backend:tech-writer"
    description: |
      コードの変更差分をドキュメントに反映する。
      docs-src/ のMarkdownを更新し、public/docs/ にHTMLをビルドしてコミットする。
      コミット済みコードとバージョン情報をもとにマニュアル・仕様書を最新化する。
    on_complete:
      next: pr-creator
    on_escalation:
      next: human-escalator

  - id: pr-creator
    agent: pr-creator
    label: "backend:pr-creator"
    description: レビュー合格・ドキュメント更新後にプルリクエストを作成し、人間に承認を依頼する
    on_complete:
      next: human-merge-approval
    on_escalation:
      next: human-escalator

  - id: human-merge-approval
    agent: human-escalator
    label: "escalated:human"
    description: PR承認・マージは常に人間が行う
    on_complete:
      condition: 人間がマージ完了
      next: contributor-close
    on_escalation:
      next: human-escalator

  - id: human-escalator
    agent: human-escalator
    label: "escalated:human"
    description: 判断できない事項を人間にエスカレーション
    on_complete:
      condition: 人間が判断・返答
      next: return_to_previous  # エスカレーション元のステップに戻る

  - id: contributor-close
    agent: contributor
    label: "contributor:ready"
    description: DOD確認・コメント品質チェック・Issueクローズ・インシデント調査
    on_complete:
      action: close_issue
