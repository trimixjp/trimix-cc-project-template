# エスカレーションルール定義
#
# 各トリガーのフィールド:
#   id:          トリガー識別子（human-escalator のエスカレーションコメント
#                「エスカレーション種別」に記載する値。既存 type と同値）
#   type:        トリガー種別（後方互換のため id と同値で維持）
#   priority:    優先度（P1: 即時の人間判断が必要 / P2: 当日中の対応が望ましい / P3: 急がない）
#   description: トリガーの概要
#   detection:   エスカレーションと判定するための具体手順（記載の順番どおりに確認する）

escalation_triggers:
  # 法的判断・契約に関わる内容
  - id: legal
    type: legal
    priority: P1
    description: 法的判断、契約、コンプライアンスに関わる内容
    detection: |
      以下を順に確認し、1つでも該当すればエスカレーションと判定する:
        1. 作業内容に利用規約・ライセンス・契約文書の作成・変更・解釈が含まれるか
        2. 個人情報・機密情報の取り扱い方針の新規決定・変更が必要か
        3. 外部サービス・ライブラリの規約/ライセンスの遵守可否の判断が必要か

  # 予算・費用の承認
  - id: budget
    type: budget
    priority: P2
    description: 予算承認、費用の発生を伴う判断
    detection: |
      以下を順に確認し、1つでも該当すればエスカレーションと判定する:
        1. 新規に費用が発生するサービス・プランの契約または変更が必要か
        2. 既存サービスの利用量増加により追加費用の発生が見込まれるか
        3. 費用見積もり・予算枠の承認が作業継続の前提になっているか

  # PR・マージの承認
  - id: merge_approval
    type: merge_approval
    priority: P2
    description: プルリクエストの承認とマージは常に人間が行う
    detection: |
      以下のいずれかに到達した時点でエスカレーションと判定する:
        1. ワークフローがプルリクエスト作成ステップに到達した
        2. main ブランチ（または保護ブランチ）へのマージが必要になった
      ※ このトリガーは例外なく常にエスカレーションする（AIによる自動マージは禁止）

  # 仕様の曖昧さ
  - id: ambiguous_spec
    type: ambiguous_spec
    priority: P3
    description: |
      ルール・仕様書・CLAUDE.mdに記述がなく、どちらを採用しても優劣がつかない場合
    detection: |
      以下の3箇所をこの順で各1回検索してから判定する:
        1. .claude/rules/ 配下の .md ファイルを検索する
        2. CLAUDE.md を検索する
        3. docs/ 配下の仕様書を検索する
      判定基準:
        - 1〜3のいずれかで記述が見つかった場合 → その記述に従う（エスカレーションしない）
        - 記述が見つからないが、選択肢に優劣がつけられる場合
          → 判断根拠をIssueコメントに記録して自走する（エスカレーションしない）
        - 記述が見つからず、かつ選択肢に優劣がつかない場合のみ → エスカレーションと判定する

transparency_rules:
  - 全ての判断には根拠を記録する
  - 参照したファイル・仕様書・ルールを明示する
  - 懸念点は「未解決」として明示する
  - 判断できなかった場合は理由を記録してエスカレーション
