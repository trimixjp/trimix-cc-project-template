# モデル・effort プロファイル定義（runtime 対応）
#
# setup（/ai-team-setup）で runtime・性能・effort を選択すると、
# 各エージェント定義・スキルの frontmatter（model / effort）に反映されます。
# 再 setup で runtime を切り替え可能です。
#
# 細かい設定は各 md ファイルの model / effort を直接編集してください。
#
# 実装の SSOT は bin/lib/model-profiles.js です。

defaults:
  runtime: claude-code
  performance: balance
  effort: normal

# ---------------------------------------------------------------------------
# 実行基盤
# ---------------------------------------------------------------------------
runtimes:
  claude-code:
    label: Claude Code
    models_note: fable / opus / sonnet / haiku
  grok:
    label: Grok Build
    models_note: grok-4.5 / grok-composer-2.5-fast
    mirror: .grok/agents と .grok/commands にミラー

# ---------------------------------------------------------------------------
# 性能プロファイル × runtime × role
# ---------------------------------------------------------------------------
# Claude Code
#   high-performance: leader=fable, verifier=opus, worker=opus, simple=sonnet
#   balance:          leader=opus,  verifier=opus, worker=sonnet, simple=haiku
#   low-cost:         leader=sonnet, verifier=sonnet, worker=sonnet, simple=haiku
#
# Grok Build
#   high-performance / balance: leader=grok-4.5, verifier=grok-4.5, worker=grok-4.5, simple=grok-composer-2.5-fast
#   low-cost:                   すべて grok-composer-2.5-fast

# ---------------------------------------------------------------------------
# effort 深度 × runtime
# ---------------------------------------------------------------------------
# Claude: deep=xhigh, normal=high, light=medium
# Grok:   deep=high,  normal=high, light=medium

# ---------------------------------------------------------------------------
# role
# ---------------------------------------------------------------------------
# leader   … オーケストレータ・チームリーダー
# verifier … レビュー・QA など他者成果物の合否判定（検証専任）
# worker   … 実装・調査
# simple  … PR作成・版バンプ・公開など
