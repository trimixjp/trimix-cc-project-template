# フロントエンドチーム レビュー設定
# レビュー方式は Frontend-Lead が実装内容の影響範囲を分析して自動判断します
# このファイルはその判断基準を定義します

review:
  mode: auto  # AIが以下の基準に従って自動判断します

  # ダブルレビュー（reviewer-a + reviewer-b + クロスレビュー）を選択する基準
  # 以下のいずれかに1つでも該当する場合はダブルレビュー
  double_review_criteria:
    file_count_threshold: 5          # 変更ファイル数がこれ以上
    sensitive_areas:                 # これらの領域を含む変更（pattern は拡張正規表現。全 pattern に単語境界 \b を付与。detection_procedure で機械照合する）
      - id: auth-ui
        description: 認証UI（login / auth / session）
        pattern: '\b(auth|login|logout|session|signin|signup|token)\b'
      - id: payment-ui
        description: 決済UI（payment / checkout / billing）
        pattern: '\b(payment|checkout|billing|stripe|cart)\b'
      - id: personal-form
        description: 個人情報フォーム（user / profile / password）
        pattern: '\b(user|profile|password|email|address|account)\b'
      - id: design-system
        description: デザインシステムの破壊的変更（共通コンポーネント・スタイル変数・テーマの変更）
        pattern: '\b(design-system|theme|token|variables|components/(common|shared|ui))\b'
      - id: public-api-interface
        description: 公開APIとのインターフェース変更（リクエスト・レスポンスの型変更・エンドポイント変更）
        pattern: '\b(api|endpoint|openapi|swagger|types/api)\b'
    labels:                          # これらのラベルが付与されている場合
      - "complexity:high"
      - "security-sensitive"
      - "breaking-change"

  # 機械判定手順
  # Frontend-Lead はこの手順どおりにコマンドを実行し、計測値（ファイル数・ヒットした pattern と件数）を
  # レビュー方式判断コメントに必ず記載する。主観での判定は禁止
  # 注: grep -c の結果は「マッチ行数」。ヒット0件時は grep が終了コード1を返すため `|| true` を併記する
  detection_procedure:
    base_branch: main   # 計測の基準ブランチ。プロジェクトのデフォルトブランチに合わせて変更
    steps:
      # 0. 基準ブランチの存在確認
      - id: verify-base
        command: 'git rev-parse --verify <base_branch>'
        judge: "失敗した場合は計測不能。安全側に倒しダブルレビューとし、その旨をレビュー方式判断コメントに記録する"
      # 1. 変更ファイル数
      - id: file-count
        command: 'git diff --name-only <base_branch>...HEAD | wc -l'
        judge: "結果が file_count_threshold（5）以上ならダブルレビュー該当"
      # 2. パス照合（該当確定）
      - id: path-match
        command: 'git diff --name-only <base_branch>...HEAD | grep -ciE "<pattern>" || true'
        judge: "各 sensitive_areas の pattern についてマッチ行数が1以上なら該当確定（ヒットした id と件数をコメントに記録する）"
      # 3. 本文照合（参考値）
      - id: body-match
        command: 'git diff <base_branch>...HEAD --unified=0 | grep "^+" | grep -ciE "<pattern>" || true'
        judge: "マッチ行数をコメントに記録するのみ（参考値）。該当判定には使わない"

  # シングルレビュー（reviewer のみ）を選択する基準
  # ダブルレビュー基準に該当しない場合はシングルレビュー
  single_review_criteria:
    - 単一コンポーネントの軽微な変更
    - ドキュメント・コメントのみの変更
    - テストの追加（実装ロジックの変更なし）
    - スタイル・フォーマットの修正
    - 静的なコンテンツ（テキスト・画像）の変更

# 全レビュアー共通のレビュー基準（チェックリスト）
# reviewer / reviewer-a / reviewer-b はこのチェックリストを参照してレビューする
# （各エージェント定義に共通基準を重複記載しない。重点観点の差別化は各エージェント定義を参照）
review_criteria:
  - id: correctness
    item: 機能の正しさ
    check: 要件・設計方針どおりに動作し、エッジケースが考慮されている
  - id: test-coverage
    item: テスト網羅
    check: 新規実装箇所にテストが存在し、正常系・異常系をカバーしている
  - id: readability
    item: 可読性・保守性
    check: 命名が意図を表現し、1コンポーネント・1関数が単一の責務を持つ。重複ロジック・重複スタイルがない
  - id: security
    item: セキュリティ
    check: XSS（dangerouslySetInnerHTML の不適切な使用等）・CSP 違反・外部リソースの不正インポートがない。シークレットのハードコードがない
  - id: performance
    item: パフォーマンス
    check: 不要な再レンダリング・大きなバンドルサイズ・未最適化の画像がない。Core Web Vitals に悪影響を与えない
  - id: error-handling
    item: エラー処理
    check: 失敗しうる処理（API 呼び出し・非同期処理）に適切なエラーハンドリングがあり、エラーを握りつぶしていない
  - id: accessibility
    item: アクセシビリティ
    check: WCAG 2.1 AA を満たす（適切な ARIA 属性・キーボード操作・フォーカス管理・コントラスト比）。違反は CRITICAL 扱い
  - id: responsive
    item: レスポンシブデザイン
    check: モバイル・タブレット・デスクトップの各ブレークポイントで正常に表示される
  - id: design-system-compliance
    item: デザインシステム準拠
    check: プロジェクトのデザインシステム・スタイルガイドに準拠している
  - id: browser-compat
    item: ブラウザ互換性
    check: 対象ブラウザで動作する実装になっている

# レビュー完了後のフロー
post_review:
  create_pr: true
  pr_agent: pr-creator
