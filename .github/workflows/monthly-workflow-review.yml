# 月次ワークフロー見直しIssueを自動作成するGitHub Actions
# 毎月1日の午前9時（JST）に実行する

name: 月次ワークフロー見直しIssue作成

on:
  schedule:
    # UTC 00:00 = JST 09:00
    - cron: "0 0 1 * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 対象月を取得
        id: date
        run: |
          echo "month=$(date '+%Y-%m')" >> "$GITHUB_OUTPUT"
          echo "title=[Review] ワークフロー月次見直し — $(date '+%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: 見直しIssueを作成
        uses: actions/github-script@v7
        with:
          script: |
            const month = '${{ steps.date.outputs.month }}';
            const title = '${{ steps.date.outputs.title }}';

            const body = `## 見直し対象ファイル

            - \`.claude/teams/*/workflow.yml\`
            - \`.claude/teams/*/agents/*.md\`
            - \`.claude/ai-team-config.yml\`
            - \`.github/ISSUE_TEMPLATE/*.yml\`

            ## ワークフロー定義のレビュー項目

            - [ ] 全ての \`on_complete\` に \`next\` または \`action\` が定義されている
            - [ ] 全ての \`on_escalation\` が \`human-escalator\` を指している
            - [ ] 並列ステップの \`requires_all_of\` が正しく設定されている
            - [ ] ラベル命名規則（\`<チーム名>:<エージェント名>\`）が統一されている
            - [ ] \`on_rework\` の差し戻し先が適切なステップを指している
            - [ ] \`contributor-close\` が全ワークフローの終端として定義されている

            ## エージェント定義のレビュー項目

            - [ ] エージェント定義とワークフローのステップIDが一致している
            - [ ] エスカレーション条件が最新の運用状況に合っている
            - [ ] GitHub Issueコメントフォーマットが陳腐化していない
            - [ ] 新規エージェントを追加した場合、\`ai-team-config.yml\` の \`target_labels\` が更新されている

            ## 設定ファイルのレビュー項目

            - [ ] \`ai-team-config.yml\` の \`version_management\` 設定が現在の運用に合っている
            - [ ] \`poll_interval_minutes\` が適切な値に設定されている
            - [ ] \`skip_labels\` に除外すべきラベルが漏れなく含まれている

            ## インシデント・学習のレビュー項目

            - [ ] \`.claude/incidents/index.yml\` に前月のインシデントが記録されている
            - [ ] 繰り返し発生しているエスカレーションパターンがないか確認した
            - [ ] DODのチェックリストに抜け漏れがないか確認した
            - [ ] compliance-rules が法改正・業界動向を反映している

            ---

            ## 完了条件（DOD）

            - [ ] 上記チェックリストの全項目を確認した
            - [ ] 問題があれば修正してコミットした
            - [ ] 改善提案があれば別Issueを作成した

            ---

            > このIssueは GitHub Actions により毎月1日に自動作成されます。
            > ラベル \`backend:tech-lead\` が付与されているため、Tech-Lead が自動起動します。`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['backend:tech-lead']
            });

            console.log(`月次見直しIssueを作成しました: ${title}`);
